<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#050f09"/>

  <!-- Subtle bg glow -->
  <circle cx="50" cy="42" r="48" fill="url(#glow)"/>

  <!-- Chat bubble -->
  <path d="M 13 16 Q 13 10 19 10 L 81 10 Q 87 10 87 16 L 87 62 Q 87 68 81 68 L 38 68 L 23 84 L 27 68 L 19 68 Q 13 68 13 62 Z"
        fill="#081f10" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Rising bars -->
  <rect x="22" y="48" width="12" height="13" rx="3" fill="url(#bar)" opacity="0.72"/>
  <rect x="40" y="37" width="12" height="24" rx="3" fill="url(#bar)" opacity="0.86"/>
  <rect x="58" y="24" width="12" height="37" rx="3" fill="url(#bar)"/>

  <!-- Trend line -->
  <polyline points="28,46 46,35 64,20" stroke="#6ee7b7" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

  <!-- Trend dot -->
  <circle cx="64" cy="20" r="4" fill="#a7f3d0"/>
  <circle cx="64" cy="20" r="2" fill="#fff" opacity="0.9"/>
</svg>
